org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9 memakai built-in Kotlin; KSP Room masih mendaftarkan source set lewat
# kotlin.sourceSets, jadi error ini harus dimatikan agar modul bisa dikonfigurasi.
android.disallowKotlinSourceSets=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
